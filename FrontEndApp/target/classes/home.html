<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Frontend App — Calendar</title>
</head>
<body>
<h1>Frontend App</h1>
<div th:if="${username}">
    <p>Logged in as: <b th:text="${username}"></b></p>
    <p><a th:href="@{/calendar-data}">Call Calendar Service (requires role my-role)</a></p>
    <form th:action="@{/logout}" method="post"><button type="submit">Logout</button></form>
    <pre th:text="${calendarJson}"></pre>
</div>
<div th:if="${username} == null">
    <p>You are not logged in.</p>
    <a href="/oauth2/authorization/keycloak">Login with Keycloak</a>
</div>
</body>
</html>
