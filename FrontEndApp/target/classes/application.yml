server:
  port: 8080

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: frontend-app
            client-secret: EmpEfOIeT1XeSiQIONPHNpciqNnJP7Cu
            authorization-grant-type: authorization_code
