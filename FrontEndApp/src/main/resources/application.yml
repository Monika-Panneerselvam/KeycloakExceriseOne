server:
  port: 8080

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: frontend-app
            client-secret: frontend-secret   # if confidential
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - roles
        provider:
          keycloak:
            issuer-uri: https://localhost:8082/realms/admin

# URL of the calendar service we will call
calendar:
  base-url: http://localhost:8081

logging:
  level:
    org.springframework.security: DEBUG